name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

        # Restrict permissions to minimum required (principle of least privilege)
permissions:
    contents: read

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    CI: true
    GITHUB_ACTIONS: true
    # A fresh runner never reuses an incremental cache, and every test binary that links
    # DataFusion carries hundreds of MB of type debuginfo the runner's disk cannot hold.
    # Line tables keep file:line backtraces; the rest of the debuginfo is dropped in CI only.
    CARGO_INCREMENTAL: "0"
    CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up mise toolchain
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Ensure rustfmt and clippy are installed
              run: mise x -- rustup component add rustfmt clippy

            - name: Check formatting
              run: just lint-rust

    test:
        runs-on: ubuntu-latest
        # The test run plus the release build of a DataFusion workspace: 20 minutes was cut mid-link.
        timeout-minutes: 45
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up mise toolchain
              uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Free runner disk for the DataFusion test binaries
              if: runner.os == 'Linux'
              run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

            - name: Run tests (all features)
              run: mise x -- cargo nextest run --profile ci --all-features

            - name: Build release
              run: mise x -- cargo build --release --all-features

    test-cross-platform:
        strategy:
            matrix:
                # Note: While in active development, the matrix is limited to reduce CI load and time. Future iterations should expand the matrix to cover all supported platforms.
                # Code is intentionally commented out to make it easier to expand in the future.
                include:
                    # Primary Support - Linux
                    # - os: ubuntu-24.04
                    #   platform: "Linux"
                    # Disabled: ARM runners are flaky on GitHub Actions
                    # - os: ubuntu-24.04-arm
                    #   platform: "Linux"
                    # Primary Support - macOS (using available runners)
                    - os: macos-15
                      platform: "macOS"
                    # - os: macos-14
                    #   platform: "macOS"
                    # - os: macos-13
                    #   platform: "macOS"
                    # Primary Support - Windows
                    # - os: windows-2025
                    #   platform: "Windows"
                    - os: windows-2022
                      platform: "Windows"
                    # Secondary Support - Linux (using available runners)
                    - os: ubuntu-22.04
                      platform: "Linux"
                    # Note: Ubuntu 20.04, 18.04, RHEL 7, FreeBSD, and Windows Server 2019 testing would require custom runners
                    # Note: macOS 12 (Monterey) testing would require custom runners

        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        needs: quality
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up mise toolchain
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            # Run tests and build the release binary
            - name: Free runner disk for the DataFusion test binaries
              if: runner.os == 'Linux'
              run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

            - name: Run tests (all features)
              run: mise x -- cargo nextest run --profile ci --all-features
            - name: Build release
              run: mise x -- cargo build --release --all-features

    coverage:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        needs: [test, quality]
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - name: Set up mise toolchain
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Free runner disk for the DataFusion test binaries
              if: runner.os == 'Linux'
              run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

            - name: Generate coverage
              run: mise x -- cargo llvm-cov --all-features --no-report

            - name: Combine coverage reports
              run: mise x -- cargo llvm-cov report --lcov --output-path lcov.info

            - name: Upload to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  files: lcov.info
                  fail_ci_if_error: false
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: EvilBit-Labs/daemoneye
