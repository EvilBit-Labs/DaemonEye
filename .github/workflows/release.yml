# Release workflow for DaemonEye
#
# Triggered by pushing a semver tag (e.g. v0.1.0).
# Builds 3 Rust binaries (procmond, daemoneye-agent, daemoneye-cli) across
# 6 targets using GoReleaser with platform-specific configs (one job per OS).

name: Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write
    id-token: write
    attestations: write

env:
    CARGO_TERM_COLOR: always

jobs:
    release-linux:
        name: Release (Linux)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
              with:
                  toolchain: stable
                  targets: >-
                      x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

            - name: Install cross-compilation dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-aarch64-linux-gnu

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
              with:
                  distribution: goreleaser
                  version: "~> v2"
                  args: release --clean --config .goreleaser-linux.yaml
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    release-macos:
        name: Release (macOS)
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
              with:
                  toolchain: stable
                  targets: >-
                      x86_64-apple-darwin, aarch64-apple-darwin

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
              with:
                  distribution: goreleaser
                  version: "~> v2"
                  args: release --clean --config .goreleaser-macos.yaml
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    release-windows:
        name: Release (Windows)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
              with:
                  toolchain: stable
                  targets: >-
                      x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
              with:
                  distribution: goreleaser
                  version: "~> v2"
                  args: release --clean --config .goreleaser-windows.yaml
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
