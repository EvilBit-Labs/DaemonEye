[package]
name                   = "daemoneye-agent"
edition.workspace      = true
version.workspace      = true
authors.workspace      = true
license.workspace      = true
rust-version.workspace = true
repository.workspace   = true
homepage.workspace     = true
description            = "DaemonEye Detection Orchestrator"
publish                = true
keywords.workspace     = true
categories.workspace   = true
exclude.workspace      = true
readme.workspace       = true

[package.metadata.wix]
upgrade-guid = "93D6515D-DB7A-43E2-AF97-9CC73E38D93C"
path-guid    = "6E74EC37-C9F9-4E4F-9586-299D2E02B22C"
license      = false
eula         = false

[features]
# Exposes `CollectorRegistry::unauthenticated()` and the `AdmissionPolicy::Unauthenticated` variant
# it constructs. Integration tests under `tests/` are separate crates, so `cfg(test)` cannot reach
# them; this feature can, and no released build enables it. Never enable it in production.
test-only = []

[dependencies]
# Core dependencies
anyhow      = { workspace = true }
async-trait = { workspace = true }
clap        = { workspace = true }

# Internal library
daemoneye-lib      = { workspace = true }
daemoneye-eventbus = { workspace = true }
collector-core     = { workspace = true }

serde      = { workspace = true }
serde_json = { workspace = true }

thiserror          = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
uuid               = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }

[dev-dependencies]
# Self-dependency so cargo enables `test-only` when building this crate's own test targets.
daemoneye-agent = { path = ".", features = ["test-only"] }

assert_cmd = { workspace = true }
chrono     = { workspace = true }
insta      = { workspace = true }
redb       = { workspace = true }
predicates = { workspace = true }
tempfile   = { workspace = true }
# `no-env-filter` so a test sees the library's own log lines, not only this crate's.
tracing-test = { workspace = true, features = ["no-env-filter"] }

[lints]
workspace = true
