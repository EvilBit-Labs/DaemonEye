# Several tools are set to "latest" to ensure they are using the idiomatic version file.
[tools]
"cargo:cargo-zigbuild"      = "0.23.0"
cargo-binstall              = "1.21.1"
cargo-insta                 = "1.48.0"
"cargo:cargo-audit"         = "latest"
"cargo:cargo-deny"          = "0.20.2"
"cargo:cargo-llvm-cov"      = "0.8.7"
"cargo:cargo-nextest"       = "0.9.143"
"cargo:mdbook"              = "0.5.4"
"cargo:mdbook-linkcheck"    = "0.7.7"
"cargo:mdbook-tabs"         = "1.0.4"
"cargo:mdbook-mermaid"      = "0.17.1"
"cargo:mdbook-toc"          = "0.15.4"
"cargo:mdbook-admonish"     = "1.20.0"
"cargo:mdbook-open-on-gh"   = "3.0.0"
"cargo:mdbook-i18n-helpers" = "0.4.0"
just                        = "1.58.0"
python                      = "3.14.7"
rust                        = { version = "1.97.1", components = "llvm-tools,cargo,rustfmt,clippy", profile = "default" }
"cargo:cargo-outdated"      = "0.19.0"
"cargo:cargo-release"       = "1.1.5"
"cargo:cargo-auditable"     = "0.7.5"
"cargo:cargo-cyclonedx"     = "0.5.9"
"pipx:mdformat"             = { version = "1.0.0", uvx_args = "--with mdformat-gfm --with mdformat-config --with mdformat-footnote --with mdformat-front-matters --with mdformat-simple-breaks --with mdformat-web --with mdformat-gfm-alerts --with mdformat-toc" }
prettier                    = "3.9.6"
actionlint                  = "1.7.12"
lychee                      = "0.24.2"
markdownlint-cli2           = "0.23.2"
protobuf                    = "35.1"
protoc                      = "35.1"
zig                         = "0.16.0"
bun                         = "1.3.14"
goreleaser                  = "2.17.1"
"pipx:pre-commit"           = "4.6.2"
uv                          = "0.12.5"

# Many of these settings are defaults, but we are explicit in case they change in the future and to make it clear to users what is enabled.
[settings]
activate_aggressive                 = true
idiomatic_version_file_enable_tools = [ "python", "rust", "bun", "zig" ]
env_cache                           = true
exec_auto_install                   = true
github_attestations                 = true
lockfile                            = true
minimum_release_age                 = "2d"
pin                                 = true
slsa                                = true

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true
