[package]
name = "daemoneye-eventbus"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Cross-platform IPC event bus for DaemonEye monitoring system"
license.workspace = true
repository.workspace = true
keywords = [ "ipc", "eventbus", "pubsub", "monitoring", "cross-platform" ]
categories = [
    "asynchronous",
    "network-programming",
    "os::unix-apis",
    "os::windows-apis",
]

[lib]
name = "daemoneye_eventbus"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
postcard = { workspace = true }
blake3 = { workspace = true }
dashmap = { workspace = true }
interprocess = { workspace = true, optional = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
    "time",
    "net",
    "io-util",
    "process",
    "signal",
] }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }

[features]
default        = [ "cross-platform" ]
cross-platform = [ "interprocess" ]
freebsd        = [  ]
high-load      = [ "tokio/rt-multi-thread" ]

[target.'cfg(unix)'.dependencies]
# `user` is for `geteuid`: the spawn-token directory check compares the directory's owner to this
# process's effective uid, and the workspace forbids the `unsafe` a raw syscall would need.
nix = { version = "0.31.2", features = [ "signal", "process", "user" ] }

[target.'cfg(target_os = "freebsd")'.dependencies]
nix = { version = "0.31.2", features = [ "socket" ] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[dev-dependencies]
criterion  = { workspace = true, features = [ "html_reports" ] }
insta      = { workspace = true, features = [ "yaml" ] }
tempfile   = { workspace = true }
tokio-test = { workspace = true }

[[bench]]
name    = "throughput"
harness = false

[[bench]]
name    = "ipc_performance"
harness = false

[[bench]]
name    = "broker_inprocess_latency"
harness = false

[lints]
workspace = true

# Off Unix the spawn-token directory is rooted at the account's own local application-data
# directory, which is where its owner-only ACL comes from. Unix uses the socket directory and an
# explicit mode instead, so this is not pulled in there.
[target.'cfg(not(unix))'.dependencies]
dirs = { workspace = true }
