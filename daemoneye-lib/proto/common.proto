syntax = "proto3";

// Common data types shared across all IPC messages

/// Task types for detection operations
enum TaskType {
  /// Enumerate all accessible processes
  ENUMERATE_PROCESSES = 0;
  /// Check executable hash for specific process
  CHECK_PROCESS_HASH = 1;
  /// Monitor process tree hierarchy
  MONITOR_PROCESS_TREE = 2;
  /// Verify executable integrity
  VERIFY_EXECUTABLE = 3;
  /// Monitor network connections (future: netmond)
  MONITOR_NETWORK_CONNECTIONS = 4;
  /// Track file operations (future: fsmond)
  TRACK_FILE_OPERATIONS = 5;
  /// Collect performance metrics (future: perfmond)
  COLLECT_PERFORMANCE_METRICS = 6;
}

// On-disk-vs-running executable state (R2 AC6).
//
// Three-state because a bool cannot separate "probed, no mismatch" from "never
// probed", and proto3 decodes the unset field as the former — asserting a clean
// result on every platform without a probe. UNKNOWN is the zero value.
//
// Whether a running process image matches its on-disk executable.
enum OnDiskState {
  // Not probed: no implementation for this platform, the probe itself failed,
  // or the signal was dropped in conversion. Carries no claim and is never a
  // clean result.
  ON_DISK_STATE_UNKNOWN = 0;
  // Probed: the on-disk executable was deleted or replaced.
  // Must stay 1 — a legacy `on_disk_mismatch = true` is varint 1, and decoding
  // that as clean would suppress a confirmed finding. Do not reorder.
  ON_DISK_STATE_MISMATCH = 1;
  // Probed: the backing file is still linked at its path. Does NOT attest that
  // the running image's contents equal the file's — nothing is compared.
  ON_DISK_STATE_MATCH = 2;
}

/// Process filtering criteria for targeted collection
message ProcessFilter {
  /// Filter by specific process names
  repeated string process_names = 1;
  /// Filter by specific process IDs
  repeated uint32 pids = 2;
  /// Filter by executable path pattern (glob-style)
  optional string executable_pattern = 3;
}

/// File hash verification request/response
message HashCheck {
  /// Expected hash value (hex-encoded)
  string expected_hash = 1;
  /// Hash algorithm name (e.g., "sha256", "blake3")
  string hash_algorithm = 2;
  /// Path to executable for verification
  string executable_path = 3;
}

/// Hash computation result
message HashResult {
  /// Computed hash value (hex-encoded)
  string hash_value = 1;
  /// Algorithm used for computation
  string algorithm = 2;
  /// File path that was hashed
  string file_path = 3;
  /// Whether hash computation was successful
  bool success = 4;
  /// Error message if computation failed
  optional string error_message = 5;
}

/// Comprehensive process information
message ProcessRecord {
  /// Process identifier
  uint32 pid = 1;
  /// Parent process identifier
  optional uint32 ppid = 2;
  /// Process name
  string name = 3;
  /// Full path to executable
  optional string executable_path = 4;
  /// Command line arguments (space-separated)
  repeated string command_line = 5;
  /// Process start time (Unix timestamp in seconds)
  optional int64 start_time = 6;
  /// CPU usage percentage (0-100)
  optional double cpu_usage = 7;
  /// Memory usage in bytes
  optional uint64 memory_usage = 8;
  /// Executable file hash (hex-encoded)
  optional string executable_hash = 9;
  /// Hash algorithm used
  optional string hash_algorithm = 10;
  /// User ID running the process
  optional string user_id = 11;
  /// Whether process data is accessible
  bool accessible = 12;
  /// Whether executable file exists
  bool file_exists = 13;
  /// Collection timestamp (Unix timestamp in milliseconds)
  int64 collection_time = 14;
  /// ssdeep/CTPH fuzzy hash of the executable (non-cryptographic, for
  /// binary-change detection). Independent of executable_hash: may be present
  /// when executable_hash is present, or absent (see ssdeep_degraded) without
  /// affecting the SHA-256 identity hash.
  optional string ssdeep_hash = 15;
  // On-disk-vs-running state. UNKNOWN when there is no probe for the platform,
  // the probe failed, or the signal was dropped in conversion; never a clean
  // result. Nothing enforces version compatibility at the handshake, so upgrade
  // procmond and daemoneye-agent together.
  OnDiskState on_disk_state = 16;
  /// Whether ssdeep computation failed while the SHA-256 identity hash
  /// succeeded for this executable (degraded integrity coverage signal).
  bool ssdeep_degraded = 17;
}

/// Network filtering criteria (future: netmond)
message NetworkFilter {
  /// Filter by specific protocols
  repeated string protocols = 1;
  /// Filter by source addresses/ports
  repeated string source_addresses = 2;
  /// Filter by destination addresses/ports
  repeated string destination_addresses = 3;
  /// Filter by connection states
  repeated string connection_states = 4;
}

/// Filesystem filtering criteria (future: fsmond)
message FilesystemFilter {
  /// Filter by file paths (glob patterns)
  repeated string path_patterns = 1;
  /// Filter by operation types
  repeated string operation_types = 2;
  /// Filter by file extensions
  repeated string file_extensions = 3;
}

/// Performance filtering criteria (future: perfmond)
message PerformanceFilter {
  /// Filter by metric names
  repeated string metric_names = 1;
  /// Filter by system components
  repeated string components = 2;
  /// Minimum threshold values
  map<string, double> min_thresholds = 3;
  /// Maximum threshold values
  map<string, double> max_thresholds = 4;
}

/// Network connection record (future: netmond)
message NetworkRecord {
  /// Connection identifier
  string connection_id = 1;
  /// Source address and port
  string source_address = 2;
  /// Destination address and port
  string destination_address = 3;
  /// Protocol (TCP, UDP, etc.)
  string protocol = 4;
  /// Connection state
  string state = 5;
  /// Associated process ID
  optional uint32 pid = 6;
  /// Bytes sent
  uint64 bytes_sent = 7;
  /// Bytes received
  uint64 bytes_received = 8;
  /// Collection timestamp (Unix timestamp in milliseconds)
  int64 collection_time = 9;
}

/// Filesystem operation record (future: fsmond)
message FilesystemRecord {
  /// Operation identifier
  string operation_id = 1;
  /// File path
  string path = 2;
  /// Operation type (create, modify, delete, access)
  string operation_type = 3;
  /// Associated process ID
  optional uint32 pid = 4;
  /// File size
  optional uint64 file_size = 5;
  /// File permissions
  optional string permissions = 6;
  /// File hash (for integrity monitoring)
  optional string file_hash = 7;
  /// Collection timestamp (Unix timestamp in milliseconds)
  int64 collection_time = 8;
}

/// Performance metric record (future: perfmond)
message PerformanceRecord {
  /// Metric identifier
  string metric_id = 1;
  /// Metric name
  string metric_name = 2;
  /// Metric value
  double value = 3;
  /// Metric unit
  string unit = 4;
  /// Associated process ID (if applicable)
  optional uint32 pid = 5;
  /// System component (CPU, memory, disk, network)
  string component = 6;
  /// Collection timestamp (Unix timestamp in milliseconds)
  int64 collection_time = 7;
}

// ---------------------------------------------------------------------------
// Detection pushdown vocabulary (R10, R13, R16, R22)
//
// A pushdown plan is a typed, domain-agnostic predicate list over
// catalog-declared columns — deliberately NOT more fields on ProcessFilter, so
// conformance vectors have one surface to test and later collectors reuse it
// unchanged.
// ---------------------------------------------------------------------------

// Comparison operations a pushed predicate can express.
//
// Field numbers are wire-stable: prost stores proto enums as i32 and a
// collector built against an older schema skips variants it does not know.
// Never renumber; append new variants only.
enum PredicateOp {
  // Unset or unrecognized. Never treat as a comparison — a garbage op must not
  // silently read as equality. Zero value by proto3 requirement.
  PREDICATE_OP_UNSPECIFIED = 0;
  PREDICATE_OP_EQ = 1;
  PREDICATE_OP_NE = 2;
  PREDICATE_OP_LT = 3;
  PREDICATE_OP_LE = 4;
  PREDICATE_OP_GT = 5;
  PREDICATE_OP_GE = 6;
  // Membership; the predicate's `values` list holds every candidate.
  PREDICATE_OP_IN = 7;
  // SQL LIKE pattern match against a string column.
  PREDICATE_OP_LIKE = 8;
  // Regular-expression match against a string column.
  PREDICATE_OP_REGEXP = 9;
}

// Declared type of a catalog column. Mirrors the Literal variants one-for-one.
enum ColumnType {
  COLUMN_TYPE_UNSPECIFIED = 0;
  COLUMN_TYPE_STRING = 1;
  COLUMN_TYPE_INT = 2;
  COLUMN_TYPE_UINT = 3;
  COLUMN_TYPE_FLOAT = 4;
  COLUMN_TYPE_BOOL = 5;
}

// A single typed constant in a predicate.
//
// NULL is an explicit variant, not an unset oneof: an empty Literal from a
// buggy sender must not read as SQL NULL.
message Literal {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    uint64 uint_value = 3;
    double float_value = 4;
    bool bool_value = 5;
    // Marker for SQL NULL. The oneof variant carries the meaning; the bool is
    // always true when set and carries none.
    bool null_value = 6;
  }
}

// One `column op values` comparison. Predicates in a plan are ANDed together.
message Predicate {
  // Column name as declared by the owning TableDescriptor.
  string column = 1;
  PredicateOp op = 2;
  // Arity by op: exactly one value for EQ/NE/LT/LE/GT/GE/LIKE/REGEXP; one or
  // more for IN. A single repeated field keeps IN from needing its own shape.
  repeated Literal values = 3;
}

// The pushed half of a compiled rule, addressed to the collector that owns
// `table` (R13).
message PushdownPlan {
  // Catalog table this plan reads.
  string table = 1;
  // Conjunction: every predicate must hold. An empty list means no filtering.
  repeated Predicate predicates = 2;
  // Columns the rule needs. An empty list means every declared column.
  repeated string projection = 3;
  // Lifetime of the task carrying this plan (R16). The agent renews before
  // expiry while the rule is enabled; expiry marks the rule unhealthy.
  uint64 ttl_ms = 4;
}

// One column a collector declares it can serve.
message ColumnDescriptor {
  string name = 1;
  ColumnType column_type = 2;
  // Whether the column can carry SQL NULL.
  bool nullable = 3;
  // Operations the collector claims it can evaluate for this column. A
  // predicate over an operation not listed here stays in the residual (R15).
  repeated PredicateOp supported_ops = 4;
}

// One table a collector declares.
message TableDescriptor {
  string name = 1;
  repeated ColumnDescriptor columns = 2;
}

// Everything a collector advertises about the data it can serve (R10).
//
// Mirrored as a plain serde Rust struct in
// `daemoneye-eventbus/src/rpc/descriptor.rs`, because the live eventbus
// registration exchange that carries a descriptor is JSON and that crate does
// not depend on prost. Field names and semantics are identical on both sides
// (SchemaDescriptor, TableDescriptor, ColumnDescriptor, ColumnType,
// PredicateOp) — change one side and change the other.
//
// Conformance-vector results (R22) attach here, so a result is always bound to
// the collector and the descriptor version it was produced against. The
// ConformanceResult shape itself is deferred to U10 — no field tag is spent on
// it yet, deliberately: an unclaimed tag can be defined later, a reused one
// silently misreads old data.
message SchemaDescriptor {
  // Collector that owns these tables.
  string collector_id = 1;
  // Opaque version of this descriptor. The agent binds conformance results and
  // compiled rules to it.
  string descriptor_version = 2;
  repeated TableDescriptor tables = 3;
}
